
# ================================================================================
#                         OnionGate Configuration File
# ================================================================================

#
# Add your bridge lines below.
# You can add multiple bridges of the same type for better reliability.
# If one bridge fails, Tor will automatically try the next one.
#
# IMPORTANT:
#   - Each bridge must be on its own line, starting with the bridge type name.
#   - Lines starting with # are ignored.
#   - Do NOT include the "Bridge " prefix that torproject.org may provide.
#     Wrong:   Bridge obfs4 1.2.3.4:443 ...
#     Correct: obfs4 1.2.3.4:443 ...
#
# Get bridges:
#   https://bridges.torproject.org
#   https://t.me/GetBridgesBot
#   Email: bridges@torproject.org
#   Email body: get transport obfs4
#
# ================================================================================


# --- obfs4 Bridges -------------------------------------------------------
# Best overall choice. Effective against DPI.
# Requires: obfs4proxy
# Usage:    sudo oniongate start -o
#
# Format:
# obfs4 IP:PORT FINGERPRINT cert=CERT iat-mode=MODE
#
# Add your current obfs4 bridge lines below:
#
# obfs4 YOUR_BRIDGE_IP:PORT YOUR_FINGERPRINT cert=YOUR_CERT iat-mode=0


# --- Snowflake Bridges ----------------------------------------------------
# Uses WebRTC through volunteer proxies.
# Requires: snowflake-client
# Usage:    sudo oniongate start -s
#
# Format:
# snowflake IP:PORT FINGERPRINT fingerprint=FP url=URL fronts=FRONTS ice=STUN utls-imitate=TYPE
#
# Add your current Snowflake bridge lines below:
#
# snowflake YOUR_BRIDGE_IP:PORT YOUR_FINGERPRINT fingerprint=YOUR_FINGERPRINT url=YOUR_URL


# --- meek_lite Bridges ----------------------------------------------------
# Uses domain fronting through supported CDNs.
# Requires: a compatible meek transport proxy
# Usage:    sudo oniongate start -m
#
# Format:
# meek_lite IP:PORT url=URL front=FRONT utls=TYPE
#
# Add your current meek_lite bridge lines below:
#
# meek_lite YOUR_BRIDGE_IP:PORT url=YOUR_URL front=YOUR_FRONT utls=YOUR_TYPE


# ================================================================================
#                           End of Configuration
# ================================================================================
